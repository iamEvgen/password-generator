<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f7f9" />
    <meta name="description" content="Passgen — генератор паролей с гибкими настройками, светлой и тёмной темами и историей последних 25 скопированных паролей." />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Passgen — генератор паролей</title>
    <style>
      html { background: #f6f7f9; color-scheme: light; }
      html[data-theme="dark"] { background: #121419; color-scheme: dark; }
    </style>
    <script>
      (function () {
        var theme;
        try { theme = JSON.parse(localStorage.getItem('passgen-theme')); } catch (error) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#121419' : '#f6f7f9');
      })();
    </script>
  </head>
  <body>
    <noscript>Для работы генератора паролей включите JavaScript в настройках браузера.</noscript>
    <div id="root"></div>
  </body>
</html>
